# Optional: an always-on FRIDAY hub, so every device shares one memory. Same install as any device,
# running `friday serve`. Devices join with: friday login http://<this machine>:8080 <FRIDAY_TOKEN>
services:
  friday:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"   # keep this on your LAN / Tailscale only
    volumes:
      - ./data:/data                                   # memory, FRIDAY's skills, speech models
      - ./plugins:/data/plugins:ro                     # your own plugins (built-ins ship inside)
      - ${HOME}/.config/anthropic:/root/.config/anthropic:ro   # `ant auth login` profile
