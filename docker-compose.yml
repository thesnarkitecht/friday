# FRIDAY in one container: server, speech (Whisper + Piper), plugins, and every credential (from .env).
# Ears and voice are any device running the `friday` CLI with headphones paired: no audio setup here.
services:
  friday:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"   # keep this on your LAN / Tailscale only
    volumes:
      - ./data:/data                                   # memory db, FRIDAY's skills, whisper models
      - ./server/plugins:/app/plugins:ro               # add plugins without rebuilding
      - ${HOME}/.config/anthropic:/root/.config/anthropic:ro   # `ant auth login` profile
