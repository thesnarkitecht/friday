# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Friday
options:
  bundleIdPrefix: com.example.friday
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  Friday:
    type: application
    platform: iOS
    sources: [Friday]
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.friday
        SWIFT_VERSION: "5.0"  # Swift 6 strict concurrency would reject SDK callback closures without extra ceremony
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta glasses.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: This lets your phone find and connect to your glasses over Wi-Fi.
        INFOPLIST_KEY_NSCameraUsageDescription: The glasses simulator uses the iPhone camera as the glasses camera.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: FRIDAY listens so it can answer you and remember what matters.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speech is transcribed on this iPhone before it is sent to your home server.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FRIDAY uses your location for local alerts, traffic and context.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: FRIDAY watches for emergencies near you even when the app is closed.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Friday/Info.plist
      properties:
        UIBackgroundModes: [audio, location, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        LSApplicationQueriesSchemes: [shortcuts, tel, sms]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBonjourServices: [_bonjour._tcp]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.example.friday
            CFBundleURLSchemes: [friday]
        MWDAT:
          AppLinkURLScheme: "friday://"
          MetaAppID: "0"          # 0 = Developer Mode (no attestation); set from Wearables Developer Center for release
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
