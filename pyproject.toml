[project]
name = "friday"
version = "0.1.0"
description = "A System-1-first agent harness: fast typed decisions route, gate and act; big models only think when needed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",        # System 2: any OpenAI-compatible endpoint
    "typesafe-sdk>=0.7",   # System 1 decisions: Jev
    "cactus-compute>=4.1", # System 1 on-device: Needle 3 (tool calls), Mirage (vision)
    "rich>=13",            # terminal rendering
    "prompt_toolkit>=3",   # input line: history, completion
    "mempalace",           # verbatim memory (vendor/mempalace)
    "honcho-ai",           # peer modelling (vendor/honcho)
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
desktop = ["pyautogui>=0.9"]

[project.scripts]
friday = "friday.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
mempalace = { path = "vendor/mempalace", editable = true }
honcho-ai = { path = "vendor/honcho/sdks/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
