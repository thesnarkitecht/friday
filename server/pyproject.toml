# One install: `curl -fsSL https://raw.githubusercontent.com/thesnarkitecht/friday/main/install.sh | sh`
# (or `pip install ./server`) gives you `friday`, which is all of FRIDAY: brain, memory, plugins, speech.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-assistant"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2",
    "websockets>=15",
    "numpy",
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "sherpa-onnx>=1.12,<2",  # 2.x dropped the text-to-phoneme frontend FRIDAY's voice needs
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools]
packages = ["friday"]

[tool.setuptools.package-data]
friday = ["builtin_plugins/**/*", "starter_skills/**/*"]
