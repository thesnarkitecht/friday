# `pip install ./server` puts the `friday` command on any machine: talk through the headphones paired with it.
# Linux also needs PortAudio for the mic (sudo apt install libportaudio2); macOS and Windows wheels include it.
# The server's own dependencies are in requirements.txt / requirements-voice.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-assistant"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "websockets>=12", "sounddevice>=0.5", "numpy", "webrtcvad-wheels>=2.0.14"]

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools]
packages = ["friday"]
